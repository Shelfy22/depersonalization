[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anonumization"
version = "0.1.0"
description = "Local Russian PII filtering for LLM messages and documents"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1", "presidio-analyzer>=2.2.360,<3", "python-dotenv>=1,<2",
  "python-docx>=1.1,<2", "openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
ml = ["torch>=2.6,<3", "transformers>=4.51,<5", "safetensors>=0.5", "sentencepiece>=0.2,<0.2.2"]
gliner = ["anonumization[ml]", "gliner>=0.2.21,<0.3", "protobuf>=5,<7"]
pdf = ["PyMuPDF>=1.25.3,<2"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
